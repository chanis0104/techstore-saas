<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Vendeur</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-6">

    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-white">Connexion Vendeur</h1>
            <p class="text-sm text-slate-400 mt-1">Accédez à votre tableau de bord e-commerce</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            {% if form.errors %}
            <div class="bg-red-500/10 border border-red-500/30 text-red-300 p-3 rounded-xl text-sm">
                Nom d'utilisateur ou mot de passe incorrect. Veuillez réessayer.
            </div>
            {% endif %}

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Nom d'utilisateur</label>
                <input type="text" name="username" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Mot de passe</label>
                <input type="password" name="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-blue-900/20 mt-2">
                Se connecter
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-slate-400">
            Pas encore de boutique ? <a href="{% url 'inscription' %}" class="text-blue-400 hover:underline font-medium">Inscrivez-vous ici</a>
        </div>
        <div class="mt-3 text-center text-xs">
            <a href="{% url 'annuaire_boutiques' %}" class="text-slate-500 hover:text-slate-300">← Retour à l'accueil</a>
        </div>
    </div>

</body>
</html>
